[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "billing-engine"
version = "0.1.0.dev0"
description = "Self-hostable billing, subscriptions, entitlements, audit, analytics, and channel/partner sales for any SaaS."
readme = "readme.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "SULAIMAN H", email = "sulaiman.h7877@gmail.com" }]
keywords = [
    "billing",
    "subscriptions",
    "entitlements",
    "saas",
    "sqlalchemy",
    "fastapi",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "pydantic>=2.6,<3",
    "fastapi>=0.110",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
billing = "billing_engine.cli:app"

[project.urls]
Homepage = "https://github.com/sulaimanh7877/saas-billing"
Repository = "https://github.com/sulaimanh7877/saas-billing"
Issues = "https://github.com/sulaimanh7877/saas-billing/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/billing_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["billing_engine"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/billing_engine/adapters/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests requiring a real PostgreSQL or MySQL database",
]

[tool.coverage.run]
branch = true
source = ["billing_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
